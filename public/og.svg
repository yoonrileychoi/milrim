  <text x="853" y="526" text-anchor="middle"
    font-family="Pretendard, sans-serif"
    font-size="14" font-weight="400" fill="#6E9E4E">밀린 계획은 AI가 다시 함께 정리해드릴게요.</text>

  <!-- Bottom dots -->
  <circle cx="811" cy="556" r="4" fill="#C8C2B4"/>
  <circle cx="827" cy="556" r="4" fill="#2E5A3A"/>
  <circle cx="843" cy="556" r="4" fill="#C8C2B4"/>

</svg>
