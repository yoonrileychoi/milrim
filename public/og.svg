  <!-- Card 4: 격려 문구 -->
  <rect x="568" y="452" width="570" height="128" rx="22" fill="#EEF5E7" filter="url(#s)"/>

  <!-- Mini logo bars -->
  <rect x="614" y="482" width="7" height="22" rx="3" fill="#9CC36B" opacity="0.7"/>
  <rect x="624" y="474" width="7" height="30" rx="3" fill="#6E9E4E" opacity="0.8"/>
  <rect x="634" y="467" width="7" height="37" rx="3" fill="#2E5A3A" opacity="0.9"/>
  <rect x="644" y="475" width="7" height="29" rx="3" fill="#6E9E4E" opacity="0.8"/>
  <rect x="654" y="483" width="7" height="21" rx="3" fill="#9CC36B" opacity="0.7"/>

  <text x="853" y="497" text-anchor="middle"
