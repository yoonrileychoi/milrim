        src: url('file:///C:/Users/seven/AppData/Local/Microsoft/Windows/Fonts/Pretendard-Regular.otf');
      }
      @font-face {
        font-family: 'Pretendard';
        font-weight: 500;
        src: url('file:///C:/Users/seven/AppData/Local/Microsoft/Windows/Fonts/Pretendard-Medium.otf');
      }
