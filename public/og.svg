  <rect x="208" y="87"  width="30" height="121" rx="9" fill="#6E9E4E"/>
  <rect x="244" y="58"  width="30" height="150" rx="9" fill="#2E5A3A"/>
  <rect x="280" y="90"  width="30" height="118" rx="9" fill="#6E9E4E"/>
